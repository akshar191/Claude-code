[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fea-topopt"
version = "1.0.0"
description = "A verified plane elasticity finite element solver and SIMP topology optimiser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["fea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
